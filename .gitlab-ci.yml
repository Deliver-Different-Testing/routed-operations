include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

variables:
  DOTNET_VERSION: "10.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

# Shared rules: only fire on MRs targeting protected branches + pushes to
# master. Mirrors Configurator's `.test-rules` shape.
.test-rules:
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(staging|master|main)$/
    - if: $CI_COMMIT_BRANCH == "master"

# Frontend lint + type-check. Blocking - a red run fails the pipeline.
test:frontend:lint:
  stage: templating
  image: node:22-alpine
  extends: .test-rules
  allow_failure: false
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run lint
    - npm run type-check

# Frontend unit tests (vitest + jsdom + MSW). Blocking - a red suite fails
# the pipeline and blocks the merge. Coverage regex reports the "Lines" %
# to GitLab's MR widget; cobertura + junit artifacts render as inline
# reports.
test:frontend:unit:
  stage: templating
  image: node:22-alpine
  extends: .test-rules
  allow_failure: false
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run test:ci
  coverage: '/^Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      junit: junit-frontend.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# Backend unit tests (xUnit.v3 via Microsoft Testing Platform). Blocking.
# NuGet cache pulls from the branch key, falling back to master so a fresh
# branch does not re-download every package.
test:backend:unit:
  stage: templating
  image: mcr.microsoft.com/dotnet/sdk:10.0
  extends: .test-rules
  allow_failure: false
  retry:
    max: 2
    when: runner_system_failure
  variables:
    NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"
  cache:
    key: nuget-${CI_COMMIT_REF_SLUG}
    paths:
      - .nuget/packages/
    policy: pull-push
    fallback_keys:
      - nuget-master
  script:
    - dotnet test tests/RoutedOperations.Tests/RoutedOperations.Tests.csproj --configuration Release --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage-backend
    - 'find ./coverage-backend -name "coverage.cobertura.xml" -exec cp {} ./coverage-backend/cobertura.xml \;'
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)\s*%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage-backend/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-backend/cobertura.xml
