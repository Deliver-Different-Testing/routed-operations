include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

variables:
  DOTNET_VERSION: "10.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

# Shared rules: only fire test jobs on MRs targeting protected branches
# + pushes to master. Mirrors Configurator's `.test-rules` shape.
.test-rules:
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(staging|master|main)$/
    - if: $CI_COMMIT_BRANCH == "master"

# Cache node_modules keyed on package-lock so `npm ci` restores the
# whole tree in seconds instead of ~90s per job. Fallback to master so
# a fresh branch inherits the last-known-good install rather than a
# cold registry fetch.
.npm-cache:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push
    fallback_keys:
      - npm-master

# Frontend lint + type-check. Blocking - a red run fails the pipeline.
# `interruptible: true` cancels an in-flight run when a new push arrives
# so stacked pushes don't queue up wasted runner time.
test:frontend:lint:
  stage: templating
  image: node:22-alpine
  extends:
    - .test-rules
    - .npm-cache
  interruptible: true
  allow_failure: false
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # `lint` and `type-check` are both `tsc --noEmit` - running both was
    # a duplicate tsc pass. Keep type-check as the canonical name.
    - npm run type-check

# Frontend unit tests (vitest + jsdom + MSW). Sharded across N parallel
# jobs to cut wall clock; a follow-on `test:frontend:unit:merge` job
# combines the blob reports + coverage into the canonical cobertura +
# junit that GitLab renders on the MR.
#
# Each shard runs ~half the 1942-test suite with coverage collection
# but skips the coverage-threshold gate (VITEST_SKIP_THRESHOLDS=1) since
# per-shard coverage always sits below the floor. The merge job runs
# without the env var so thresholds evaluate against merged coverage
# from every shard - which is the correct picture.
test:frontend:unit:
  stage: templating
  image: node:22-alpine
  extends:
    - .test-rules
    - .npm-cache
  interruptible: true
  allow_failure: false
  parallel: 2
  variables:
    VITEST_SKIP_THRESHOLDS: "1"
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - mkdir -p .vitest-reports
    - npx vitest run --coverage --reporter=blob --outputFile=".vitest-reports/blob-${CI_NODE_INDEX}.json" --shard=${CI_NODE_INDEX}/${CI_NODE_TOTAL}
  artifacts:
    when: always
    expire_in: 1 hour
    paths:
      - .vitest-reports/
      - coverage/

# Merges the sharded blob reports into the final coverage + junit
# artefacts. Runs after every shard finishes; a red shard still fails
# the pipeline, but the merge only needs to run to surface the coverage
# gate + MR widget when shards are green.
test:frontend:unit:merge:
  stage: templating
  image: node:22-alpine
  extends:
    - .test-rules
    - .npm-cache
  interruptible: true
  allow_failure: false
  needs:
    - job: test:frontend:unit
      artifacts: true
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    # `--coverage` is required on the merge step even though shards already
    # captured raw coverage - without it, vitest skips the reporter pass +
    # threshold evaluation on the merged data, so no cobertura + no
    # text-summary output for the GitLab MR widget regex to match.
    - npx vitest --merge-reports=./.vitest-reports --coverage --reporter=default --reporter=junit --outputFile=junit-frontend.xml
  coverage: '/^Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      junit: junit-frontend.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# Backend unit tests (xUnit.v3 via Microsoft Testing Platform). Blocking.
# NuGet cache pulls from the branch key, falling back to master so a
# fresh branch does not re-download every package.
test:backend:unit:
  stage: templating
  image: mcr.microsoft.com/dotnet/sdk:10.0
  extends: .test-rules
  interruptible: true
  allow_failure: false
  retry:
    max: 2
    when: runner_system_failure
  variables:
    NUGET_PACKAGES: "${CI_PROJECT_DIR}/.nuget/packages"
  cache:
    key: nuget-${CI_COMMIT_REF_SLUG}
    paths:
      - .nuget/packages/
    policy: pull-push
    fallback_keys:
      - nuget-master
  script:
    # `-v minimal` cuts msbuild noise; `-nologo` drops the startup banner
    # per invocation. Coverlet's runsettings now emits cobertura only (was
    # cobertura+json+lcov+opencover) so the write step is ~4x cheaper.
    - dotnet test tests/RoutedOperations.Tests/RoutedOperations.Tests.csproj --configuration Release --nologo -v minimal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage-backend
    - 'find ./coverage-backend -name "coverage.cobertura.xml" -exec cp {} ./coverage-backend/cobertura.xml \;'
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)\s*%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage-backend/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-backend/cobertura.xml
