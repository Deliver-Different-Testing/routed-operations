include:
  - project: 'urgent-couriers/ci-templates'
    file: 'ci-template.yml'
    ref: 'main'

variables:
  DOTNET_VERSION: "10.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

# Frontend type-check gate. The SPA is built by the Dockerfile during the
# image build; this job fails the pipeline fast on a TypeScript error before
# the (slower) dockerize + deploy stages run. Mirrors the stack convention of
# keeping the app's own test/lint jobs in the templating stage.
test:frontend:
  stage: templating
  image: node:22-alpine
  allow_failure: false
  script:
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run type-check
  rules:
    - if: $CI_MERGE_REQUEST_IID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(staging|master|main)$/
    - if: $CI_COMMIT_BRANCH == "master"
