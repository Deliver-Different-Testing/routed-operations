include:
  - template: Auto-DevOps.gitlab-ci.yml

stages:
  - .pre
  - build
  - test
  - deploy
  - review
  - dast
  - staging
  - otgcargo
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 100%
  - release
  - performance
  - cleanup
  - .post

otgcargo:
  extends: staging
  stage: otgcargo
  before_script:
    - export HELM_UPGRADE_VALUES_FILE=".gitlab/otgcargo-auto-deploy-values.yaml"
  cache: []
  environment:
    name: otgcargo
    url: $OTGCARGO_ADDITIONAL_HOSTS
  rules:
    - if: $OTGCARGO_ADDITIONAL_HOSTS == null
      when: never
    - if: ($CI_KUBERNETES_ACTIVE == null || $CI_KUBERNETES_ACTIVE == "") && ($KUBECONFIG == null || $KUBECONFIG == "")
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: "$OTGCARGO_ENABLED"