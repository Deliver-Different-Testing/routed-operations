# Values for the crossroads tenant RoutedOperations deployment.
# Probes: /health/live (liveness/startup), /healthz (readiness, SqlServer).
replicaCount: 1

extraLabels:
  tenant: crossroads

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: tenant
          operator: In
          values:
          - crossroads

tolerations:
  - key: tenant
    operator: Equal
    value: crossroads
    effect: NoSchedule

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 85
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

ingress:
  tls:
    enabled: true
  annotations:
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "32m"
  modSecurity:
    enabled: false
    secRuleEngine: "DetectionOnly"
  spec:
    ingressClassName: "nginx"
service:
  externalPort: 5000
  internalPort: 8080
startupProbe:
  enabled: true
  path: "/health/live"
  probeType: "httpGet"
  scheme: "HTTP"
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 10
livenessProbe:
  path: "/health/live"
  initialDelaySeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  scheme: "HTTP"
  probeType: "httpGet"
readinessProbe:
  path: "/healthz"
  initialDelaySeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
  scheme: "HTTP"
  probeType: "httpGet"

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 10"]
